name: CI build

on:
  push:
    branches: [ master ]
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cups cups-bsd ripmime wget texlive-font-utils iproute2 mailutils telnet strace nvi
          wget https://github.com/aardsoft/debug-smtpd/releases/download/0.1/debug-smtpd-linux-amd64
          chmod +x debug-smtpd-linux-amd64
          ip -4 addr sh
      - name: Install mail filter
        run: |
          sudo make install
          sudo cp mailrc.local /etc/cups
      - name: Configure printer queue
        run: |
          sudo sed -i 's/^LogLevel.*/LogLevel debug/' /etc/cups/cupsd.conf
          sudo cupsd
          sudo lpadmin -p email-sample -E -v email:/sample -D 'Sample email printer' -L 'Printer location' -m email.ppd
          sudo lpadmin -p email-sample -E -o MailFrom=Custom.my.printer@example.com
          sudo lpadmin -p email-sample -E -o mailx_MAILRC=Custom.mailrc.local
          sudo lpadmin -p email-sample -E -o mailx_AttachFlag=Custom.-A
          sudo lpstat -p email-sample -l
      - name: Run print job
        run: |
          ./debug-smtpd-linux-amd64 --tls-mode starttls --max-emails 0 --filename-template "{{.Index}}" &
          sleep 5 # allow some time for smtpd to start up
          echo "This text goes into the PDF" | lpr -P email-sample
          for i in {1..10}; do
            if [ -f received/1.eml ]; then
              ripmime -v -i received/1.eml -d parts
              break
            else
              sudo lpstat -p email-sample -l
              sudo lpstat -W all
            fi
            sleep 5
          done
          if ! [ -f received/1.eml ]; then
            cat /var/log/cups/*
            exit 1
          fi
      - name: Upload mails
        uses: actions/upload-artifact@v6
        with:
          name: mail-data
          path: received/*
      - name: Upload split mail
        uses: actions/upload-artifact@v6
        with:
          name: mail-parts
          path: parts/*
      - name: Extract release notes from last commit message
        if: startsWith(github.ref, 'refs/tags/')
        id: release_notes
        run: |
          notes=$(git log -1 --pretty=%B | sed -n '/release notes:/I,${/release notes:/I!p}')
          if [ -z "$notes" ]; then
            echo "We couldn't afford release notes."
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo -e "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload assets to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          UPLOAD_URL=${RAW_UPLOAD_URL%\{*}  # Remove the {?name,label} suffix
          for filepath in email*; do
            filename=$(basename "$filepath")
            echo "Uploading $filename ..."
            curl -s --fail --data-binary @"$filepath" \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "${UPLOAD_URL}?name=${filename}"
          done
          for filepath in received/*.eml; do
            filename=$(basename "$filepath")
            echo "Uploading $filename ..."
            curl -s --fail --data-binary @"$filepath" \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "${UPLOAD_URL}?name=ci-email-${filename}"
          done
          for filepath in parts/*.pdf; do
            filename=$(basename "$filepath")
            echo "Uploading $filename ..."
            curl -s --fail --data-binary @"$filepath" \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "${UPLOAD_URL}?name=ci-pdf-${filename}"
          done
